name: Validate Community Packages

# Submits a required check (`validate-packages`) for every pull request, and
# re-validates the whole catalog on `main` pushes.
# A required status check on this job name protects the default branch.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-packages:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout community packages
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked toolchain
        run: pnpm install --frozen-lockfile

      - name: Verify install and lockfile stability
        run: |
          test -d node_modules
          git diff --exit-code -- pnpm-lock.yaml

      - name: Registry neutrality
        run: pnpm run check:registry

      - name: Validate community packages
        run: pnpm run validate

      - name: Run CLI smoke tests
        run: pnpm test